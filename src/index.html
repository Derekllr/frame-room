<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Compare two photos at a time, choose your favorites, and export a shortlist. All photo processing stays on your device.">
<title>Frame Room · 摄影盲选</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23212624'/%3E%3Cpath d='M8 13V8h5m6 0h5v5m0 6v5h-5m-6 0H8v-5' fill='none' stroke='%23ecb76c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ecb76c'/%3E%3C/svg%3E">
<!-- STYLES -->
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12V6h6m8 0h6v6m0 8v6h-6m-8 0H6v-6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg>
    <div><strong>Frame Room</strong><span data-copy="brand"></span></div>
  </div>
  <div class="top-actions">
    <select id="language" aria-label="语言 / Language"><option value="zh">中文</option><option value="en">English</option></select>
    <button class="icon-button" data-action="help" data-label="help" type="button">?</button>
    <button id="import-button" class="primary" data-action="import" type="button"><span aria-hidden="true">+</span> <span data-copy="import"></span></button>
    <input id="file-input" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" aria-label="Workspace">
    <div class="session">
      <div class="overline" data-copy="session"></div>
      <strong id="session-name"></strong>
      <span id="session-tag" class="tag"></span>
    </div>
    <nav id="views" aria-label="Views">
      <button class="nav-item" data-action="view" data-view="duel" type="button"><span class="nav-mark" aria-hidden="true">◫</span><span data-copy="duel"></span><small>01</small></button>
      <button class="nav-item" data-action="view" data-view="library" type="button"><span class="nav-mark" aria-hidden="true">⊞</span><span data-copy="library"></span><small id="nav-count">00</small></button>
      <button class="nav-item" data-action="view" data-view="rank" type="button"><span class="nav-mark" aria-hidden="true">≡</span><span data-copy="rank"></span><small>03</small></button>
    </nav>
    <div class="stats" id="stats"></div>
    <div class="sidebar-bottom">
      <div class="privacy"><i aria-hidden="true"></i><span data-copy="local"></span></div>
      <button id="clear-button" class="quiet" data-action="clear" type="button" data-copy="clear"></button>
    </div>
  </aside>
  <main id="main" class="main">
    <div id="import-status" class="import-status" hidden>
      <div class="import-line"><strong id="import-label"></strong><button id="cancel-import" class="quiet" data-action="cancel" data-copy="cancel" type="button"></button></div>
      <progress id="import-progress" value="0" max="1"></progress>
    </div>
    <div id="screen"></div>
  </main>
</div>
<div id="drop-overlay" class="drop-overlay" hidden><div><span aria-hidden="true">↓</span><strong data-copy="drop"></strong><small data-copy="formats"></small></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="help-dialog" aria-labelledby="help-title">
  <div class="dialog-head"><h2 id="help-title" data-copy="help"></h2><button class="icon-button" data-action="close" data-label="close" type="button">×</button></div>
  <div class="dialog-body">
    <p data-copy="helpDuel"></p><p data-copy="helpRank"></p><p data-copy="helpFiles"></p><p data-copy="helpStorage"></p>
    <div class="shortcuts help-keys" id="help-keys"></div>
    <details><summary data-copy="credits"></summary><ul id="credits-list"></ul></details>
  </div>
</dialog>
<dialog id="inspect-dialog" class="inspect-dialog" aria-labelledby="inspect-title">
  <div class="dialog-head"><h2 id="inspect-title"></h2><button class="icon-button" data-action="close" data-label="close" type="button">×</button></div>
  <img id="inspect-image" alt="">
  <p id="inspect-caption"></p>
</dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-head"><h2 id="confirm-title"></h2><button class="icon-button" data-action="close" data-label="close" type="button">×</button></div>
  <div class="dialog-body"><p id="confirm-text"></p><div class="confirm-actions"><button class="secondary" data-action="close" data-copy="back" type="button"></button><button class="danger" data-action="confirm" data-copy="confirm" type="button"></button></div></div>
</dialog>
<!-- APP -->
</body>
</html>
