<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Compare two photos at a time, choose your favorites, and export a shortlist. All photo processing stays on your device.">
<title>Frame Room · 摄影盲选</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23212624'/%3E%3Cpath d='M8 13V8h5m6 0h5v5m0 6v5h-5m-6 0H8v-5' fill='none' stroke='%23ecb76c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ecb76c'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --ground:#171918; --shell:#1d201e; --panel:#222622; --well:#101211;
  --border:#343a35; --line:#2b302c; --ink:#eeeee7; --muted:#a9b0a8; --faint:#818980;
  --accent:#eabc7a; --accent-ink:#231b0f; --green:#a7bba2;
  --mono:"Cascadia Mono",Consolas,monospace;
  font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--ground); color:var(--ink); }
button,select,input { font:inherit; }
button,select { color:inherit; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.46; }
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible {
  outline:2px solid var(--accent); outline-offset:3px;
}
button { border:1px solid transparent; background:none; border-radius:4px; }
a { color:var(--accent); }
h1,h2,p { margin:0; }
img { display:block; max-width:100%; }
.bar {
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  min-height:68px; padding:0 30px; border-bottom:1px solid var(--border); background:var(--shell);
}
.brand { display:flex; align-items:center; gap:11px; white-space:nowrap; }
.brand svg { color:var(--accent); }
.brand strong { display:block; font-size:18px; font-weight:650; line-height:1.25; letter-spacing:-.4px; }
.brand span { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
.top-actions { display:flex; gap:10px; align-items:center; }
.top-actions select {
  border:1px solid var(--border); border-radius:4px; background:var(--shell); padding:7px 8px; min-height:36px; font-size:12px;
}
.primary,.secondary,.quiet,.icon-button,.danger {
  min-height:36px; padding:7px 12px; font-weight:550; white-space:nowrap;
}
.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.primary:not(:disabled):hover { background:#f5cb92; }
.secondary,.icon-button { border-color:var(--border); background:var(--panel); }
.secondary:not(:disabled):hover,.icon-button:not(:disabled):hover,.quiet:not(:disabled):hover { background:#2c332e; }
.icon-button { width:36px; height:36px; padding:0; font:16px var(--mono); color:var(--muted); }
.quiet { color:var(--muted); font-size:12px; }
.danger { color:#ffb7a6; border-color:#744a40; background:#342422; }
.layout { display:grid; grid-template-columns:218px minmax(0,1fr); min-height:calc(100vh - 68px); }
.sidebar {
  background:var(--shell); border-right:1px solid var(--border); padding:27px 16px 18px;
  display:flex; flex-direction:column; gap:20px;
}
.session { padding:0 8px; display:grid; gap:5px; justify-items:start; }
.overline { color:var(--faint); font:10px/1.5 var(--mono); letter-spacing:.1em; text-transform:uppercase; }
.session strong { font-size:15px; font-weight:600; }
.tag { color:var(--green); background:#29332a; border:1px solid #3c493d; border-radius:3px; font:10px/1.5 var(--mono); padding:2px 5px; }
#views { display:grid; gap:4px; }
.nav-item {
  width:100%; min-height:40px; display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center;
  gap:9px; padding:6px 9px; text-align:left; color:var(--muted);
}
.nav-item:hover { background:var(--panel); color:var(--ink); }
.nav-item[aria-current="page"] {
  color:var(--ink); border-color:var(--border); border-left-color:var(--accent); background:#292d29;
}
.nav-item small,.nav-mark { font-family:var(--mono); }
.nav-item small { font-size:10px; color:var(--faint); }
.nav-mark { font-size:16px; color:var(--accent); }
.stats { border-top:1px solid var(--line); padding:14px 8px 0; display:grid; gap:9px; }
.metric { display:flex; justify-content:space-between; gap:8px; align-items:baseline; font-size:12px; color:var(--muted); }
.metric strong { color:var(--ink); font:12px var(--mono); }
.metric.bytes { border-top:1px solid var(--line); padding-top:12px; margin-top:3px; }
.sidebar-bottom { margin-top:auto; display:grid; gap:10px; justify-items:start; padding-left:8px; }
.privacy { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); }
.privacy i { width:6px; height:6px; border-radius:50%; background:var(--green); flex:none; }
.sidebar-bottom .quiet { padding-left:0; min-height:28px; }
.main { padding:25px clamp(18px,3vw,42px) 20px; min-width:0; }
#screen,.import-status { max-width:1350px; margin-inline:auto; }
.screen-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:19px; }
.screen-title h1 { font-size:clamp(21px,2.45vw,30px); font-weight:620; letter-spacing:-.035em; line-height:1.2; }
.screen-title p { margin-top:7px; color:var(--muted); font-size:13px; }
.round { min-width:145px; text-align:right; }
.round strong { font:12px var(--mono); color:var(--ink); }
progress {
  display:block; width:100%; height:5px; border:none; appearance:none; background:var(--line); color:var(--accent);
}
progress::-webkit-progress-bar { background:var(--line); }
progress::-webkit-progress-value { background:var(--accent); }
progress::-moz-progress-bar { background:var(--accent); }
.round progress { margin-top:8px; }
.duel-pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:13px; }
.duel-card { min-width:0; border:1px solid var(--border); background:var(--shell); border-radius:5px; overflow:hidden; }
.frame {
  width:100%; display:block; position:relative; border:0; padding:0; border-radius:0;
  height:clamp(210px,34vw,460px); background:var(--well);
}
.frame img { width:100%; height:100%; object-fit:contain; }
.frame:focus-visible { outline-offset:-3px; }
.frame:hover .zoom { color:var(--accent); }
.frame-index,.zoom {
  position:absolute; top:10px; width:29px; height:27px; display:grid; place-items:center;
  background:#141815e8; border:1px solid #ffffff38; border-radius:3px; font:12px var(--mono); color:#f5f5ec;
}
.frame-index { left:10px; }
.zoom { right:10px; font-size:17px; }
.choose {
  width:100%; min-height:49px; display:flex; align-items:center; gap:9px; justify-content:center;
  border:0; border-top:1px solid var(--border); border-radius:0; background:#252b26; color:var(--ink); font-weight:600;
}
.choose:not(:disabled):hover { background:var(--accent); color:var(--accent-ink); }
kbd {
  min-width:21px; display:inline-grid; place-items:center; padding:1px 4px; border:1px solid #626a62;
  border-radius:3px; font:11px/1.4 var(--mono); color:inherit;
}
.duel-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px 0 15px; }
.duel-actions .secondary { min-height:35px; font-size:12px; }
.shortcuts { display:flex; flex-wrap:wrap; gap:10px 18px; font-size:11px; color:var(--muted); }
.shortcuts span { display:inline-flex; align-items:center; gap:5px; }
.screen-foot {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-top:1px solid var(--line); padding:12px 0 0; color:var(--faint); font-size:11px;
}
.sheet-note { color:var(--muted); font:10px var(--mono); }
.empty {
  min-height:330px; display:grid; align-content:center; justify-items:center; gap:12px;
  border:1px dashed #475046; border-radius:5px; background:var(--shell); padding:28px;
  text-align:center;
}
.empty-symbol { font:36px var(--mono); color:var(--accent); margin-bottom:4px; }
.empty h2 { font-size:19px; font-weight:600; }
.empty p { color:var(--muted); max-width:420px; }
.empty-actions,.exports { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.exports { justify-content:flex-start; margin-bottom:15px; }
.exports .primary,.exports .secondary { font-size:12px; }
.file-list { display:grid; gap:6px; }
.file-row {
  display:grid; grid-template-columns:46px 90px minmax(100px,1fr) minmax(130px,auto) auto;
  align-items:center; gap:13px; padding:8px 10px; border:1px solid var(--line); background:var(--shell); border-radius:4px;
}
.file-row .position { color:var(--faint); font:13px var(--mono); text-align:center; }
.file-row .position.top { color:var(--accent); }
.file-thumb { padding:0; width:90px; height:60px; border:0; overflow:hidden; background:var(--well); }
.file-thumb img { width:100%; height:100%; object-fit:contain; }
.file-name { min-width:0; }
.file-name strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:600; }
.file-name small,.file-detail small { color:var(--muted); display:block; font:11px/1.6 var(--mono); margin-top:3px; }
.file-detail { text-align:right; font:12px var(--mono); }
.file-detail b { font-weight:500; color:var(--accent); }
.file-actions { display:flex; gap:5px; }
.pick[aria-pressed="true"] { color:var(--accent); border-color:#7e6848; background:#332c21; }
.section-note { margin:13px 0; color:var(--muted); font-size:12px; }
.import-status { background:var(--shell); border:1px solid var(--border); border-radius:4px; padding:10px 12px 12px; margin-bottom:16px; }
.import-line { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:5px; }
.import-line strong { font-size:12px; font-weight:500; }
.import-errors { margin:9px 0 0; padding-left:18px; color:#efb4a5; font-size:12px; overflow-wrap:anywhere; }
.drop-overlay { position:fixed; inset:0; z-index:9; background:#101611e8; display:grid; place-items:center; pointer-events:none; }
.drop-overlay > div { display:grid; place-items:center; gap:12px; padding:40px; border:1px dashed var(--accent); }
.drop-overlay span { font:30px var(--mono); color:var(--accent); }
.drop-overlay small { color:var(--muted); }
#toast { position:fixed; z-index:11; bottom:18px; left:50%; transform:translateX(-50%); width:max-content; max-width:min(560px,90vw); }
#toast:not(:empty) { background:#303931; border:1px solid #526052; border-radius:4px; padding:10px 13px; font-size:13px; box-shadow:0 3px 16px #0006; }
dialog { width:min(580px,calc(100% - 28px)); border:1px solid var(--border); border-radius:5px; background:var(--shell); color:var(--ink); padding:0; }
dialog::backdrop { background:#070a08cb; }
.dialog-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--border); }
.dialog-head h2 { font-size:16px; font-weight:600; overflow-wrap:anywhere; }
.dialog-body { padding:15px 18px 20px; }
.dialog-body p { color:var(--muted); font-size:13px; margin:0 0 12px; }
.dialog-body details { border-top:1px solid var(--border); margin-top:15px; padding-top:12px; color:var(--muted); font-size:12px; }
.dialog-body summary { cursor:pointer; }
.help-keys { padding-top:4px; }
.inspect-dialog { width:min(1040px,calc(100% - 28px)); }
.inspect-dialog img { width:100%; height:min(68vh,730px); object-fit:contain; background:var(--well); }
.inspect-dialog p { color:var(--muted); padding:10px 18px; font:12px var(--mono); }
.confirm-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:15px; }
@media (min-width:1550px) { .main { padding-top:32px; } }
@media (max-width:870px) {
  .layout { grid-template-columns:173px minmax(0,1fr); }
  .sidebar { padding-inline:10px; }
  .main { padding-inline:17px; }
  .file-row { grid-template-columns:28px 62px minmax(0,1fr) auto; gap:8px; }
  .file-thumb { width:62px; height:46px; }
  .file-detail { grid-column:3; grid-row:2; text-align:left; }
  .file-detail small { display:inline; margin-left:6px; }
  .file-actions { grid-column:4; grid-row:1; }
}
@media (max-width:640px) {
  .bar { padding:10px 12px; gap:8px; min-height:61px; }
  .brand { gap:5px; }
  .brand svg { width:24px; height:24px; }
  .brand strong { font-size:15px; }
  .brand span { font-size:9px; }
  .top-actions { gap:5px; }
  .top-actions .primary { font-size:12px; padding-inline:8px; }
  .top-actions select { padding-inline:3px; max-width:66px; font-size:11px; }
  .top-actions .icon-button { width:28px; }
  .layout { grid-template-columns:minmax(0,1fr); }
  .sidebar { padding:8px 11px; gap:7px; border-right:0; border-bottom:1px solid var(--border); }
  .session { display:flex; gap:7px; align-items:center; padding:2px 3px; }
  .session .overline { display:none; }
  .session strong { font-size:11px; }
  #views { grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; }
  .nav-item { gap:4px; font-size:11px; grid-template-columns:12px minmax(0,1fr) auto; padding-inline:4px; min-height:35px; }
  .nav-mark { font-size:13px; }
  .nav-item small { font-size:9px; }
  .stats { display:none; }
  .sidebar-bottom { display:flex; justify-content:space-between; padding-left:3px; }
  .sidebar-bottom .quiet { padding:2px 0; min-height:24px; font-size:11px; }
  .privacy { font-size:10px; }
  .main { padding:15px 11px; }
  .screen-head { align-items:flex-start; gap:7px; margin-bottom:12px; }
  .screen-title p { font-size:11px; }
  .round { min-width:83px; }
  .round strong { font-size:10px; }
  .duel-pair { gap:7px; }
  .frame { height:clamp(132px,48vw,310px); }
  .frame-index,.zoom { top:5px; width:24px; height:23px; font-size:11px; }
  .frame-index { left:5px; } .zoom { right:5px; font-size:14px; }
  .choose { font-size:12px; gap:6px; min-height:44px; }
  .duel-actions { gap:5px; }
  .duel-actions .secondary { padding-inline:8px; min-height:40px; }
  .screen-foot { align-items:flex-start; flex-direction:column; }
  .shortcuts { gap:7px 10px; font-size:10px; }
  .file-row { padding-inline:5px; }
  .file-actions .icon-button { width:32px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; } }

</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12V6h6m8 0h6v6m0 8v6h-6m-8 0H6v-6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg>
    <div><strong>Frame Room</strong><span data-copy="brand"></span></div>
  </div>
  <div class="top-actions">
    <select id="language" aria-label="语言 / Language"><option value="zh">中文</option><option value="en">English</option></select>
    <button class="icon-button" data-action="help" data-label="help" type="button">?</button>
    <button id="import-button" class="primary" data-action="import" type="button"><span aria-hidden="true">+</span> <span data-copy="import"></span></button>
    <input id="file-input" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple hidden>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" aria-label="Workspace">
    <div class="session">
      <div class="overline" data-copy="session"></div>
      <strong id="session-name"></strong>
      <span id="session-tag" class="tag"></span>
    </div>
    <nav id="views" aria-label="Views">
      <button class="nav-item" data-action="view" data-view="duel" type="button"><span class="nav-mark" aria-hidden="true">◫</span><span data-copy="duel"></span><small>01</small></button>
      <button class="nav-item" data-action="view" data-view="library" type="button"><span class="nav-mark" aria-hidden="true">⊞</span><span data-copy="library"></span><small id="nav-count">00</small></button>
      <button class="nav-item" data-action="view" data-view="rank" type="button"><span class="nav-mark" aria-hidden="true">≡</span><span data-copy="rank"></span><small>03</small></button>
    </nav>
    <div class="stats" id="stats"></div>
    <div class="sidebar-bottom">
      <div class="privacy"><i aria-hidden="true"></i><span data-copy="local"></span></div>
      <button id="clear-button" class="quiet" data-action="clear" type="button" data-copy="clear"></button>
    </div>
  </aside>
  <main id="main" class="main">
    <div id="import-status" class="import-status" hidden>
      <div class="import-line"><strong id="import-label"></strong><button id="cancel-import" class="quiet" data-action="cancel" data-copy="cancel" type="button"></button></div>
      <progress id="import-progress" value="0" max="1"></progress>
    </div>
    <div id="screen"></div>
  </main>
</div>
<div id="drop-overlay" class="drop-overlay" hidden><div><span aria-hidden="true">↓</span><strong data-copy="drop"></strong><small data-copy="formats"></small></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="help-dialog" aria-labelledby="help-title">
  <div class="dialog-head"><h2 id="help-title" data-copy="help"></h2><button class="icon-button" data-action="close" data-label="close" type="button">×</button></div>
  <div class="dialog-body">
    <p data-copy="helpDuel"></p><p data-copy="helpRank"></p><p data-copy="helpFiles"></p><p data-copy="helpStorage"></p>
    <div class="shortcuts help-keys" id="help-keys"></div>
    <details><summary data-copy="credits"></summary><ul id="credits-list"></ul></details>
  </div>
</dialog>
<dialog id="inspect-dialog" class="inspect-dialog" aria-labelledby="inspect-title">
  <div class="dialog-head"><h2 id="inspect-title"></h2><button class="icon-button" data-action="close" data-label="close" type="button">×</button></div>
  <img id="inspect-image" alt="">
  <p id="inspect-caption"></p>
</dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-head"><h2 id="confirm-title"></h2><button class="icon-button" data-action="close" data-label="close" type="button">×</button></div>
  <div class="dialog-body"><p id="confirm-text"></p><div class="confirm-actions"><button class="secondary" data-action="close" data-copy="back" type="button"></button><button class="danger" data-action="confirm" data-copy="confirm" type="button"></button></div></div>
</dialog>

function fit(width, height, edge) {

function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

function standings(photos, votes) {
  const stats = new Map(photos.map((photo, index) => [photo.id, {photo, index, rating:1000, played:0, wins:0, ties:0}]));
  const pairCounts = new Map();
  for (const {a, b, outcome} of votes) {
    const x = stats.get(a), y = stats.get(b);
    if (!x || !y || x === y || !['a', 'b', 'tie'].includes(outcome)) continue;

  if (photos.length < 2) return null;
  const { ranked, pairCounts } = standings(photos, votes);
  const shuffled = ranked.map(item => ({...item, roll:random()})).sort((a, b) => a.played - b.played || a.roll - b.roll);

  let candidates = shuffled.slice(1);

function canvasOf(width, height) {

  const canvas = document.createElement('canvas');

async function workerPhoto(file) {
  if (typeof Worker === 'undefined' || typeof OffscreenCanvas === 'undefined') return processPhoto(file);
  const url = URL.createObjectURL(new Blob([WORKER_SOURCE], {type:'text/javascript'}));
  let worker, timer;
  try {
    return await new Promise((resolve, reject) => {
      try { worker = new Worker(url); } catch (error) { reject(error); return; }
      timer = setTimeout(() => reject(new PhotoError('unreadable')), 45_000);
      worker.onmessage = ({data}) => data.error ? reject(new PhotoError(data.error)) : resolve(data.photo);
      worker.onerror = reject;
      worker.postMessage({id:0,file});
    });
  } catch (error) {
    if (error instanceof PhotoError) throw error;
    worker?.terminate();
    return processPhoto(file);
  } finally {
    clearTimeout(timer); worker?.terminate(); URL.revokeObjectURL(url);
  }
}

async function importPhotos(files, demo = false) {

  importing = true; cancelled = false; importCount = 0; errors = [];
  importIndex = 1; importTotal = files.length;
  render();
  let order = session.photos.reduce((n,p) => Math.max(n,p.order),0);
  let occupied = session.photos.reduce((n,p) => n + p.bytes + p.thumbnail.size,0);
  for (const file of files) {
    if (cancelled) break;
    const replaceDemo = !demo && session.demo;
    if (!replaceDemo && session.photos.length >= LIMITS.count) {
      errors.push({name:file.name,code:'maximum'}); break;
    }
    const key = [file.name,file.size,file.lastModified].join('|');
    try {
      if (!replaceDemo && session.photos.some(photo => photo.key === key)) throw new PhotoError('duplicate');
      const result = await workerPhoto(file);
      if ((replaceDemo ? 0 : occupied) + result.bytes + result.thumbnail.size > LIMITS.shelf) throw new PhotoError('shelf');
      if (replaceDemo) {
        session.photos = []; session.votes = []; session.goal = 0; pair = null;
        session.demo = false; occupied = 0; order = 0;
      }
      const photo = {...result, key, id:makeId(), picked:false, order:++order};
      session.photos.push(photo);
      occupied += photo.bytes + photo.thumbnail.size;
      session.goal = Math.min(MAX_VOTES, Math.max(session.goal, initialGoal(), session.votes.length + session.photos.length));
      importCount++;
      await save({put:[photo]});
    } catch (error) {
      errors.push({name:file.name, code:error.code || 'unreadable'});
    }
    importIndex = Math.min(importTotal, importIndex + 1);
    renderImport();
  }
  importing = false;
  if (importCount) { pair = nextPair(session.photos,session.votes,pair); view = 'duel'; }

async function loadDemo() {

    let bytes;
    if (sample.data) bytes = Uint8Array.from(atob(sample.data), c => c.charCodeAt(0));
    else {
      const response = await fetch('./demo/' + encodeURIComponent(sample.name), {signal:AbortSignal.timeout(8000)});
      if (!response.ok) throw new Error('Demo photo unavailable');
      bytes = await response.blob();

  }));

  const files = results.filter(result => result.status === 'fulfilled').map(result => result.value);
  if (!files.length) { session.demo = false; render(); toast('demoUnavailable'); return; }
  await importPhotos(files,true);

  if (importing || !session.votes.length) return;
  const previous = session.votes.pop();
  pair = {a:previous.a,b:previous.b}; view = 'duel';
  void save(); render(); toast('undone');
}
function skip() {
  if (view !== 'duel' || importing || !pair || session.photos.length < 3 || session.votes.length >= session.goal) return;
  pair = nextPair(session.photos,session.votes,pair);
  render(); toast('skipped');
}
function inspect(photo, side) {
  if (!photo) return;
  const blind = side === 'a' || side === 'b';
  const label = blind ? t(side === 'a' ? 'leftPhoto' : 'rightPhoto') : photo.name;
  if (inspectUrl) URL.revokeObjectURL(inspectUrl);
  inspectUrl = URL.createObjectURL(photo.blob);
  $('inspect-title').textContent = label;
  $('inspect-image').src = inspectUrl; $('inspect-image').alt = label;
  $('inspect-caption').textContent = blind ? t('preview') : t('preview') + ' · ' + photo.width + ' × ' + photo.height + ' · ' + fmt(photo.bytes);
  $('inspect-dialog').showModal();
}
function confirmAction(title,text,run) {
  $('confirm-title').textContent = t(title); $('confirm-text').textContent = t(text);
  pendingConfirm = run; $('confirm-dialog').showModal();
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob), a = node('a');
  a.href = url; a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15_000);
}
function fileName(row,index) {
  return serial(index + 1) + '-' + exportName(row.photo.name) + '.jpg';
}
function csvField(value) {
  let s = String(value);
  if (/^\s*[=+\-@]/.test(s) || /^[\t\r\n]/.test(s)) s = "'" + s;
  return '"' + s.replaceAll('"','""') + '"';
}
async function contactSheet(rows) {
  const cols = Math.min(5, rows.length), pad = 26, gap = 10, cell = 330, tile = 220, step = tile + 46;
  const width = pad * 2 + cols * cell + (cols - 1) * gap;
  const height = 98 + Math.ceil(rows.length / cols) * step + pad;
  const canvas = canvasOf(width,height);
  try {
    const ctx = canvas.getContext('2d',{alpha:false});
    ctx.fillStyle = '#ecebe3'; ctx.fillRect(0,0,width,height);
    ctx.fillStyle = '#232822'; ctx.font = '600 29px sans-serif';
    ctx.fillText('Frame Room',pad,44);
    ctx.fillStyle = '#59645b'; ctx.font = '14px sans-serif';
    ctx.fillText(t('sheet').replace(/^导出\s*|^Export\s+/,''),pad,67);
    for (let i = 0; i < rows.length; i++) {
      const {photo} = rows[i], x = pad + i % cols * (cell + gap), y = 98 + Math.floor(i / cols) * step;
      const bitmap = await createImageBitmap(photo.thumbnail);
      try {
        const scale = Math.min(cell / bitmap.width, tile / bitmap.height);
        const w = bitmap.width * scale, h = bitmap.height * scale;
        ctx.fillStyle = '#222723'; ctx.fillRect(x,y,cell,tile);
        ctx.drawImage(bitmap,x + (cell - w) / 2,y + (tile - h) / 2,w,h);
      } finally { bitmap.close(); }
      ctx.fillStyle = '#222723'; ctx.font = '14px sans-serif';
      const line = serial(i + 1) + '   ' + photo.name;
      let label = line;
      while (label.length > 1 && ctx.measureText(label + '…').width > cell) label = label.slice(0,-1);
      ctx.fillText(label + (label === line ? '' : '…'),x,y + tile + 23);
    }
    return await jpegOf(canvas,.9);
  } finally { canvas.width = 1; canvas.height = 1; }
}
async function exportPicks(kind) {
  if (exporting || importing) return;
  const rows = picks();
  if (!rows.length) { toast('pickFirst'); return; }
  exporting = true; render(); toast('exporting');
  try {
    if (kind === 'zip') {
      const archive = await makeZip(rows.map((row,i) => ({name:fileName(row,i),blob:row.photo.blob})));
      download(archive,'frame-room-picks.zip');
    } else {
      download(await contactSheet(rows),'frame-room-contact-sheet.jpg');
    }
    toast('exported');
  } catch { toast('exportFailed'); }
  finally { exporting = false; render(); }
}

$('file-input').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = ''; void importPhotos(files);
});
$('language').addEventListener('change', e => {
  locale = e.target.value;
  try { localStorage.setItem('frame-room-language',locale); } catch {}
  applyCopy(); render();
});
$('inspect-dialog').addEventListener('close', () => {
  if (inspectUrl) URL.revokeObjectURL(inspectUrl);
  inspectUrl = null; $('inspect-image').removeAttribute('src');
});
document.addEventListener('click', event => {
  const target = event.target.closest('[data-action]');
  if (!target || target.disabled) return;
  const action = target.dataset.action, photo = byId(target.dataset.id);
  if (action === 'import') $('file-input').click();
  if (action === 'demo') void loadDemo();
  if (action === 'help') $('help-dialog').showModal();
  if (action === 'close') target.closest('dialog').close();
  if (action === 'view') { view = target.dataset.view; render(); }
  if (action === 'inspect') inspect(photo,target.dataset.side);
  if (action === 'vote') pickPair(target.dataset.side);
  if (action === 'skip') skip();
  if (action === 'undo') undo();
  if (action === 'cancel') { cancelled = true; renderImport(); }
  if (action === 'continue') {
    session.goal = Math.min(MAX_VOTES,session.votes.length + session.photos.length);
    pair = nextPair(session.photos,session.votes,pair); void save(); render();
  }
  if (action === 'pick' && photo) { photo.picked = !photo.picked; void save({put:[photo]}); render(); }
  if (action === 'top') {
    const top = rank().filter(row => row.played).slice(0,5).map(row => row.photo);
    for (const p of top) p.picked = true;
    void save({put:top}); render();
  }
  if (action === 'download' && photo) { download(photo.blob,exportName(photo.name) + '-preview.jpg'); toast('exported'); }
  if (action === 'zip' || action === 'sheet') void exportPicks(action);
  if (action === 'csv') {
    const rows = rank().map(({photo,rating,played,wins,ties},i) =>
      [played ? i + 1 : '',photo.name,played ? Math.round(rating) : '',played,wins,ties,photo.picked ? 1 : 0,photo.originalBytes,photo.bytes]);
    const head = 'rank,filename,rating,decisions,wins,ties,starred,original_bytes,preview_bytes';
    const csv = head + '\r\n' + rows.map(row => row.map(csvField).join(',')).join('\r\n');
    download(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}),'frame-room-ranking.csv'); toast('exported');
  }
  if (action === 'remove' && photo) confirmAction('removeTitle','removeText', () => {
    session.photos = session.photos.filter(p => p !== photo);
    session.votes = session.votes.filter(v => v.a !== photo.id && v.b !== photo.id);
    session.goal = Math.max(session.votes.length,initialGoal());
    pair = nextPair(session.photos,session.votes,pair); void save({remove:[photo.id]}); render();
  });
  if (action === 'clear') confirmAction('clearTitle','clearText', () => {
    session.photos = []; session.votes = []; session.goal = 0; session.demo = false;
    errors = []; pair = null; view = 'duel'; void save({clear:true}); render();
  });
  if (action === 'confirm') {
    $('confirm-dialog').close();
    const run = pendingConfirm; pendingConfirm = null; run?.();
  }
});
document.addEventListener('keydown', event => {
  if (view !== 'duel' || event.repeat || document.querySelector('dialog[open]') ||
      event.target.matches?.('input,select,textarea,[contenteditable]')) return;
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); undo(); return; }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const choice = {'1':'a','2':'b','=':'tie'}[event.key];
  if (choice && pair) { event.preventDefault(); pickPair(choice); }
  if (event.key === 'ArrowRight' && pair) { event.preventDefault(); skip(); }
});
let dragDepth = 0;
const draggedFiles = event => event.dataTransfer?.types.includes('Files');
document.addEventListener('dragenter', event => {
  if (!draggedFiles(event)) return;
  event.preventDefault(); dragDepth++; $('drop-overlay').hidden = false;
});
document.addEventListener('dragover', event => { if (draggedFiles(event)) event.preventDefault(); });
document.addEventListener('dragleave', event => {
  if (!draggedFiles(event)) return;
  if (--dragDepth <= 0) { dragDepth = 0; $('drop-overlay').hidden = true; }
});
document.addEventListener('drop', event => {
  if (!draggedFiles(event)) return;
  event.preventDefault(); dragDepth = 0; $('drop-overlay').hidden = true;
  if (ready) void importPhotos([...event.dataTransfer.files]);
});

for (const photo of DEMO) {
  const li = node('li'), a = node('a','',photo.author);
  a.href = photo.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.append(a); $('credits-list').append(li);
}
applyCopy(); render();
let restored = false;
try { restored = await restore(); } catch { saved = false; }
ready = true; render();
if (!restored) await loadDemo();

</script>
